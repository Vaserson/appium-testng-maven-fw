# Platforms: web, android, ios
platform=web
# Web Configuration
web.base.url=https://www.google.com
web.browser=chrome
web.headless=false
web.implicit.wait=10
web.explicit.wait=20

# Strings XML Configuration
stringsXml=strings/google_web.xml
locatorsPath=src/test/resources/locators/google

# Screenshot Configuration
saveElementScreenshots=true
# Will save screenshots to 'locator_images/web/LOCATOR_NAME.png'
screenshotsBasePath=google
