# Platforms: web, android, ios
platform=web
# Web Configuration
web.base.url=https://www.qalight.ua
web.browser=chrome
web.headless=false
web.implicit.wait=10
web.explicit.wait=20

# Strings XML Configuration
stringsXml=strings/qalight.xml
locatorsPath=src/test/resources/locators/qalight

# Screenshot Configuration
saveElementScreenshots=true
# Will save screenshots to 'locator_images/qalight/LOCATOR_NAME.png'
screenshotsBasePath=qalight
